# Entorno del cribado virtual y el docking (fase 1, TFM).
#
# Antes: parp1_pipeline.yml. Se ha quitado la linea `prefix:`, que
# apuntaba a una ruta personal y rompe `conda env create` en otra
# maquina.
#
# Versiones instaladas, tomadas de `conda list`:
#   python             3.12.13
#   rdkit              2025.03.6
#   pandas             3.0.3
#   numpy              2.5.1
#   openbabel          3.1.1
#   pymol-open-source  3.1.0
#   plip               3.0.0
#   gemmi              0.7.5
#   meeko              0.7.1
#
# NO INCLUIDO: gnina 1.3.3, que se instalo aparte y ya no esta en el
# sistema. La version consta en docs/01_virtual_screening.md; el binario
# hay que instalarlo por separado. Ver docs/provenance.md.
name: parp1_pipeline
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12
  - plip
  - pandas
  - openbabel
  - pymol-open-source
  - rdkit
  - gemmi
  - meeko
